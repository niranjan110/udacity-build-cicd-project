name: Backend CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: starter/backend
        run: |
          python -m pip install --upgrade pip
          pip install Flask==2.2.3 Flask-Cors==3.0.10 pytest==7.2.1 flake8

      - name: Run tests
        working-directory: starter/backend
        run: python -m pytest -v

      - name: Run lint
        working-directory: starter/backend
        run: python -m flake8